# Uapaverse Monorepo — docker-compose raíz (dev)
# Orquesta backend (NestJS) + frontend (Vite) + Postgres (pgvector) + Redis
# Mantiene los docker-compose propios de cada proyecto (backend/docker-compose.yml,
# frontend/docker-compose.yml) pero permite `docker compose up --build` desde la raíz.
#
# Uso:
#   docker compose up --build           # levanta todo (dev con hot-reload)
#   docker compose up postgres redis    # solo infraestructura
#
# Puertos:
#   API       → http://localhost:4000/api/v1 (contenedor 3000)
#   Frontend  → http://localhost:5173
#   Postgres  → localhost:5432
#   Redis     → localhost:6379
#   Traductor → http://localhost:8010 (translate/, lo llama el navegador)

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: uapaverse_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-uapaverse}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uapaverse_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-redis_dev_password}"
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_dev_data:/data

  translate:
    build: ./translate
    container_name: uapaverse_translate_dev
    restart: unless-stopped
    environment:
      TRANSLATE_ALLOWED_ORIGINS: ${TRANSLATE_ALLOWED_ORIGINS:-*}
    ports:
      # Lo llama el navegador (el frontend traduce lo que recibe de la API).
      - '${TRANSLATE_PORT:-8010}:8010'
    volumes:
      - translate_cache:/data

  api:
    image: node:22-slim
    container_name: uapaverse_api_dev
    working_dir: /app
    volumes:
      - ./backend:/app
      - api_node_modules:/app/node_modules
      # evita sobreescribir el prisma client generado dentro del contenedor
      - /app/dist
    ports:
      - '4000:3000'
    env_file:
      - ./backend/.env
    environment:
      PORT: '3000'
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-uapaverse}
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-uapaverse}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ['sh', '/app/docker-entrypoint.dev.sh']

  frontend:
    image: node:22-slim
    container_name: uapaverse_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      # El alias @poker/engine de vite apunta a ../packages/poker-engine
      # (= /packages dentro del contenedor); sin esto Vite no resuelve
      # @poker/engine en Docker aunque en local (workspace completo) sí.
      - ./packages:/packages:ro
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
      VITE_APP_NAME: ${VITE_APP_NAME:-Uapaverse}
      VITE_AUTH_METHOD: ${VITE_AUTH_METHOD:-db}
      VITE_MOCK_ENABLED: ${VITE_MOCK_ENABLED:-false}
      VITE_TRANSLATE_URL: ${VITE_TRANSLATE_URL:-http://localhost:8010}
    env_file:
      - ./frontend/.env
    depends_on:
      - api
      - translate
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10.2.0 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  pg_dev_data:
  redis_dev_data:
  api_node_modules:
  frontend_node_modules:
  translate_cache:
