# Educraft XYZ — docker-compose raíz (dev)
# Un único contenedor de app ejecuta backend (NestJS) + frontend (Vite).
# Postgres (pgvector) y Redis se mantienen como servicios de infraestructura.
#
# Uso:
#   docker compose up --build           # levanta todo (dev con hot-reload)
#   docker compose up postgres redis    # solo infraestructura
#
# Puertos:
#   API       → http://localhost:4000/api/v1 (contenedor 3000)
#   Frontend  → http://localhost:5173
#   Postgres  → localhost:5432
#   Redis     → localhost:6379

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: educraft_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      POSTGRES_DB: ${DATABASE_NAME:-educraft}
    ports:
      - '${DATABASE_PORT:-5432}:5432'
    volumes:
      - pg_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: educraft_redis_dev
    restart: unless-stopped
    command: redis-server --requirepass "${REDIS_PASSWORD:-redis_dev_password}"
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis_dev_data:/data

  app:
    image: node:22-slim
    container_name: educraft_app_dev
    working_dir: /app
    volumes:
      - .:/app
      - app_node_modules:/app/node_modules
      - app_backend_node_modules:/app/backend/node_modules
      - app_frontend_node_modules:/app/frontend/node_modules
    ports:
      - '4000:3000'
      - '5173:5173'
    env_file:
      - ./backend/.env
    environment:
      PORT: '3000'
      DATABASE_USER: ${DATABASE_USER:-postgres}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-postgres}
      DATABASE_NAME: ${DATABASE_NAME:-educraft}
      DATABASE_HOST: postgres
      DATABASE_PORT: '5432'
      DATABASE_URL: postgresql://${DATABASE_USER:-postgres}:${DATABASE_PASSWORD:-postgres}@postgres:5432/${DATABASE_NAME:-educraft}
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_dev_password}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
      VITE_APP_NAME: ${VITE_APP_NAME:-Educraft XYZ}
      VITE_AUTH_METHOD: ${VITE_AUTH_METHOD:-db}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: ['sh', '/app/docker-entrypoint.dev.sh']

volumes:
  pg_dev_data:
  redis_dev_data:
  app_node_modules:
  app_backend_node_modules:
  app_frontend_node_modules:
