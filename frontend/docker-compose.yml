# Starter Frontend — desarrollo standalone con Docker (Vite con HMR).
#
# Uso (desde frontend/):
#   docker compose up --build
# Frontend → http://localhost:5173
#
# VITE_API_URL apunta a la API vista desde el navegador
# (backend en Docker: http://localhost:4000/api/v1).

services:
  frontend:
    image: node:22-slim
    container_name: starter_frontend_dev
    working_dir: /app
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:4000/api/v1}
      VITE_APP_NAME: ${VITE_APP_NAME:-Starter}
      VITE_AUTH_METHOD: ${VITE_AUTH_METHOD:-db}
    command: >
      sh -c "
        corepack enable &&
        corepack prepare pnpm@10.2.0 --activate &&
        pnpm install --frozen-lockfile &&
        pnpm run dev -- --host 0.0.0.0 --port 5173
      "

volumes:
  frontend_node_modules:
