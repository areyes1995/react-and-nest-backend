# SPA fallback para react-router + caché de assets versionados
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Rutas de la SPA: sirven index.html (react-router resuelve)
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets con hash: caché agresiva
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
